<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>喻梓轩 · 单词朗读</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;background:#f0f4f8;min-height:100vh;color:#1a202c;}
.app{max-width:960px;margin:0 auto;padding:12px 12px 60px;}
.page-header{text-align:center;padding:20px 16px 14px;background:white;border-radius:16px;border:1px solid #e2e8f0;margin-bottom:14px;}
.page-header .label{font-size:12px;color:#718096;margin-bottom:4px;}
.page-header h1{font-size:22px;font-weight:700;color:#1a202c;margin-bottom:4px;}
.page-header .sub{font-size:13px;color:#a0aec0;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:7px 16px;border-radius:20px;border:1.5px solid #e2e8f0;background:white;font-size:12px;font-weight:600;cursor:pointer;color:#718096;white-space:nowrap;}
.tab.active{color:white;border-color:transparent;}
.detail-panel{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:14px;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.08);position:sticky;top:0;z-index:100;}
.detail-inner{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
.detail-cat{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;margin-bottom:8px;font-weight:600;}
.detail-word{font-size:1.9rem;font-weight:700;font-family:'Consolas','Courier New',monospace;margin-bottom:2px;line-height:1.2;}
.detail-phonetic{font-size:13px;color:#a0aec0;margin-bottom:6px;}
.detail-meaning{font-size:15px;color:#1a202c;font-weight:700;margin-bottom:12px;}
.btn-say,.btn-slow{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:8px 16px;cursor:pointer;border-radius:10px;font-family:inherit;}
.btn-say{background:white;border:1px solid #cbd5e0;color:#1a202c;}
.btn-slow{background:#fffbeb;border:1px solid #f6d860;color:#92400e;}
.say-row{display:flex;gap:8px;flex-wrap:wrap;}
.anim-box{border-radius:12px;height:170px;display:flex;align-items:center;justify-content:center;border:1px solid #e2e8f0;font-size:56px;overflow:hidden;}
.section-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #e2e8f0;}
.section-header h2{font-size:15px;font-weight:700;}
.s-badge{font-size:11px;padding:2px 10px;border-radius:20px;font-weight:600;}
.s-count{font-size:12px;color:#a0aec0;margin-left:auto;}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;margin-bottom:20px;}
.word-card{background:white;border:1.5px solid #e2e8f0;border-radius:12px;padding:11px 8px;cursor:pointer;text-align:center;user-select:none;transition:transform 0.15s;}
.word-card:active{transform:scale(0.95);}
.word-card.active{border-width:2px;}
.card-icon{font-size:20px;margin-bottom:3px;display:block;}
.card-word{font-size:11px;font-weight:700;font-family:'Consolas','Courier New',monospace;margin-bottom:2px;word-break:break-all;}
.card-mn{font-size:10px;color:#718096;}
.search-wrap{position:relative;margin-bottom:14px;}
.search-input{width:100%;padding:11px 40px;border-radius:24px;border:1.5px solid #e2e8f0;background:white;font-size:14px;font-family:inherit;color:#1a202c;outline:none;}
.search-input:focus{border-color:#90cdf4;}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;cursor:pointer;color:#a0aec0;display:none;}
.search-results{display:none;}
.search-empty{text-align:center;padding:40px;color:#a0aec0;font-size:14px;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-26px);}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-13px);}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
@keyframes wave{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-20deg);}75%{transform:rotate(20deg);}}
@keyframes swing{0%,100%{transform:rotate(-15deg);}50%{transform:rotate(15deg);}}
@media(max-width:600px){.detail-inner{grid-template-columns:1fr;}.anim-box{height:120px;font-size:46px;}.detail-word{font-size:1.5rem;}.cards-grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;}}
</style>
</head>
<body>
<div class="app">
<div class="page-header">
  <div class="label">📖 点击单词即可朗读</div>
  <h1>喻梓轩 单词朗读</h1>
  <div class="sub">1个分类 · 共82个单词 · 点击朗读 · 慢速练习</div>
</div>
<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input class="search-input" id="searchInput" type="text" placeholder="搜索单词或中文含义..." oninput="doSearch(this.value)" autocomplete="off">
  <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
</div>
<div class="tabs" id="tabBar"></div>
<div class="detail-panel" id="detailPanel">
  <div class="detail-inner">
    <div>
      <span class="detail-cat" id="dCat"></span>
      <div class="detail-word" id="dWord"></div>
      <div class="detail-phonetic" id="dPh"></div>
      <div class="detail-meaning" id="dMn"></div>
      <div class="say-row">
        <button class="btn-say" onclick="playWord(1)">🔊 朗读</button>
        <button class="btn-slow" onclick="playWord(0.5)">🐢 慢读</button>
      </div>
    </div>
    <div class="anim-box" id="animBox"><span id="animIcon">📖</span></div>
  </div>
</div>
<div id="mainContent"></div>
<div class="search-results" id="searchResults"></div>
</div>
<script>
const catMeta={"c0": {"label": "图1", "color": "#2B6CB0", "bg": "#ebf4ff"}};
const words={"c0": [{"word": "unit", "ph": "/ˈjuː.nɪt/", "mn": "单元；单位", "ic": "📦"}, {"word": "breath", "ph": "/breθ/", "mn": "呼吸", "ic": "🫁"}, {"word": "throw", "ph": "/θroʊ/", "mn": "扔；投", "ic": "🤾"}, {"word": "count", "ph": "/kaʊnt/", "mn": "计数；数数", "ic": "🔢"}, {"word": "will", "ph": "/wɪl/", "mn": "将要；意愿", "ic": "📝"}, {"word": "music", "ph": "/ˈmjuː.zɪk/", "mn": "音乐", "ic": "🎵"}, {"word": "try", "ph": "/traɪ/", "mn": "尝试；努力", "ic": "💪"}, {"word": "with", "ph": "/wɪð/", "mn": "和……一起；用", "ic": "🤝"}, {"word": "why", "ph": "/waɪ/", "mn": "为什么", "ic": "❓"}, {"word": "mad", "ph": "/mæd/", "mn": "疯狂的；生气的", "ic": "😡"}, {"word": "also", "ph": "/ˈɔːl.soʊ/", "mn": "也；而且", "ic": "➕"}, {"word": "make", "ph": "/meɪk/", "mn": "制作；使得", "ic": "🔨"}, {"word": "proud", "ph": "/praʊd/", "mn": "自豪的；骄傲的", "ic": "😌"}, {"word": "lion", "ph": "/ˈlaɪ.ən/", "mn": "狮子", "ic": "🦁"}, {"word": "call", "ph": "/kɔːl/", "mn": "呼叫；打电话", "ic": "📞"}, {"word": "stop", "ph": "/stɑːp/", "mn": "停止", "ic": "🛑"}, {"word": "joke", "ph": "/dʒoʊk/", "mn": "笑话；开玩笑", "ic": "😂"}, {"word": "worse", "ph": "/wɜːrs/", "mn": "更差的；更糟的", "ic": "⬇️"}, {"word": "bring", "ph": "/brɪŋ/", "mn": "带来；拿来", "ic": "🎁"}, {"word": "might", "ph": "/maɪt/", "mn": "可能；也许", "ic": "🤔"}, {"word": "cup", "ph": "/kʌp/", "mn": "杯子", "ic": "🥤"}, {"word": "dangerous", "ph": "/ˈdeɪn.dʒər.əs/", "mn": "危险的", "ic": "⚠️"}, {"word": "homework", "ph": "/ˈhoʊm.wɜːrk/", "mn": "家庭作业", "ic": "📚"}, {"word": "lie", "ph": "/laɪ/", "mn": "躺；说谎", "ic": "🛌"}, {"word": "finish", "ph": "/ˈfɪn.ɪʃ/", "mn": "完成", "ic": "✅"}, {"word": "record", "ph": "/ˈrek.ɔːd/", "mn": "记录；唱片", "ic": "📝"}, {"word": "choose", "ph": "/tʃuːz/", "mn": "选择", "ic": "🤔"}, {"word": "their", "ph": "/ðeər/", "mn": "他们的", "ic": "👥"}, {"word": "play", "ph": "/pleɪ/", "mn": "玩；播放", "ic": "🎮"}, {"word": "stay", "ph": "/steɪ/", "mn": "停留", "ic": "🏨"}, {"word": "toy", "ph": "/tɔɪ/", "mn": "玩具", "ic": "🧸"}, {"word": "dig", "ph": "/dɪɡ/", "mn": "挖", "ic": "⛏️"}, {"word": "least", "ph": "/liːst/", "mn": "最少", "ic": "🔻"}, {"word": "habit", "ph": "/ˈhæb.ɪt/", "mn": "习惯", "ic": "🔁"}, {"word": "between", "ph": "/bɪˈtwiːn/", "mn": "在……之间", "ic": "↔️"}, {"word": "building", "ph": "/ˈbɪl.dɪŋ/", "mn": "建筑物", "ic": "🏢"}, {"word": "much", "ph": "/mʌtʃ/", "mn": "许多", "ic": "📈"}, {"word": "orange", "ph": "/ˈɒr.ɪndʒ/", "mn": "橙子；橙色", "ic": "🍊"}, {"word": "push", "ph": "/pʊʃ/", "mn": "推", "ic": "👉"}, {"word": "free", "ph": "/friː/", "mn": "自由的；免费的", "ic": "🆓"}, {"word": "clock", "ph": "/klɒk/", "mn": "时钟", "ic": "🕐"}, {"word": "notebook", "ph": "/ˈnəʊt.bʊk/", "mn": "笔记本", "ic": "📒"}, {"word": "cost", "ph": "/kɒst/", "mn": "花费；成本", "ic": "💰"}, {"word": "cheap", "ph": "/tʃiːp/", "mn": "便宜的", "ic": "💸"}, {"word": "glove", "ph": "/ɡlʌv/", "mn": "手套", "ic": "🧤"}, {"word": "sometimes", "ph": "/ˈsʌm.taɪmz/", "mn": "有时", "ic": "⏳"}, {"word": "little", "ph": "/ˈlɪt.əl/", "mn": "小的；少许", "ic": "🐜"}, {"word": "wait", "ph": "/weɪt/", "mn": "等待", "ic": "⏳"}, {"word": "learn", "ph": "/lɜːn/", "mn": "学习", "ic": "📚"}, {"word": "bike", "ph": "/baɪk/", "mn": "自行车", "ic": "🚲"}, {"word": "money", "ph": "/ˈmʌn.i/", "mn": "钱", "ic": "💰"}, {"word": "online", "ph": "/ˌɒnˈlaɪn/", "mn": "在线的", "ic": "💻"}, {"word": "please", "ph": "/pliːz/", "mn": "请", "ic": "🙏"}, {"word": "waste", "ph": "/weɪst/", "mn": "浪费", "ic": "🗑️"}, {"word": "snack", "ph": "/snæk/", "mn": "零食", "ic": "🍿"}, {"word": "noon", "ph": "/nuːn/", "mn": "中午", "ic": "🕛"}, {"word": "change", "ph": "/tʃeɪndʒ/", "mn": "改变", "ic": "🔄"}, {"word": "menu", "ph": "/ˈmen.juː/", "mn": "菜单", "ic": "📋"}, {"word": "classmate", "ph": "/ˈklɑːs.meɪt/", "mn": "同学", "ic": "🧑‍🎓"}, {"word": "helpful", "ph": "/ˈhelp.fəl/", "mn": "有帮助的", "ic": "🤝"}, {"word": "fourth", "ph": "/fɔːθ/", "mn": "第四", "ic": "4️⃣"}, {"word": "fifth", "ph": "/fɪfθ/", "mn": "第五", "ic": "5️⃣"}, {"word": "difference", "ph": "/ˈdɪf.ər.əns/", "mn": "差别", "ic": "🔀"}, {"word": "tool", "ph": "/tuːl/", "mn": "工具", "ic": "🛠️"}, {"word": "basket", "ph": "/ˈbɑː.skɪt/", "mn": "篮子", "ic": "🧺"}, {"word": "potato", "ph": "/pəˈteɪ.təʊ/", "mn": "土豆", "ic": "🥔"}, {"word": "either", "ph": "/ˈaɪ.ðər/", "mn": "两者之一", "ic": "🔀"}, {"word": "break", "ph": "/breɪk/", "mn": "休息", "ic": "☕"}, {"word": "right", "ph": "/raɪt/", "mn": "右边；正确的", "ic": "➡️"}, {"word": "playground", "ph": "/ˈpleɪ.ɡraʊnd/", "mn": "操场", "ic": "🛝"}, {"word": "yesterday", "ph": "/ˈjes.tər.deɪ/", "mn": "昨天", "ic": "📅"}, {"word": "important", "ph": "/ɪmˈpɔː.tənt/", "mn": "重要的", "ic": "❗"}, {"word": "without", "ph": "/wɪˈðaʊt/", "mn": "没有", "ic": "🚫"}, {"word": "hospital", "ph": "/ˈhɒs.pɪ.təl/", "mn": "医院", "ic": "🏥"}, {"word": "rest", "ph": "/rest/", "mn": "休息", "ic": "😴"}, {"word": "another", "ph": "/əˈnʌð.ər/", "mn": "另一个", "ic": "➡️"}, {"word": "team", "ph": "/tiːm/", "mn": "团队", "ic": "👥"}, {"word": "watch", "ph": "/wɒtʃ/", "mn": "观看；手表", "ic": "⌚"}, {"word": "review", "ph": "/rɪˈvjuː/", "mn": "复习；评论", "ic": "📝"}, {"word": "lonely", "ph": "/ˈləʊn.li/", "mn": "孤独的", "ic": "😔"}, {"word": "garden", "ph": "/ˈɡɑː.dən/", "mn": "花园", "ic": "🌷"}, {"word": "man", "ph": "/mæn/", "mn": "男人", "ic": "👨"}]};
const anims=['animation:bounce 0.8s infinite','animation:spin 1s linear infinite','animation:pulse 0.7s infinite','animation:float 1.2s infinite','animation:shake 0.5s infinite','animation:wave 0.8s infinite','animation:swing 1s infinite'];
let currentCat=Object.keys(catMeta)[0],currentWord=null,animTimer=null;
function playWord(rate){if(!currentWord)return;const au=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(currentWord.word)+'&type=1');au.playbackRate=rate;au.play().catch(()=>{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(currentWord.word);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u);}});}
function selectWord(w,cardEl,cat){if(cat)currentCat=cat;currentWord=w;document.querySelectorAll('.word-card').forEach(c=>c.classList.remove('active'));if(cardEl)cardEl.classList.add('active');const m=catMeta[currentCat];const panel=document.getElementById('detailPanel');panel.style.display='block';document.getElementById('dCat').textContent=m.label;document.getElementById('dCat').style.cssText='background:'+m.bg+';color:'+m.color+';display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;margin-bottom:8px;font-weight:600;';document.getElementById('dWord').textContent=w.word;document.getElementById('dWord').style.color=m.color;document.getElementById('dPh').textContent=w.ph;document.getElementById('dMn').textContent=w.mn;const box=document.getElementById('animBox');const icon=document.getElementById('animIcon');box.style.background=m.bg;icon.textContent=w.ic;icon.style.cssText=anims[w.word.charCodeAt(0)%anims.length]+';display:inline-block;';if(animTimer)clearTimeout(animTimer);animTimer=setTimeout(()=>{icon.style.animation='none';},3000);playWord(1);panel.scrollIntoView({behavior:'smooth',block:'nearest'});}
function makeCard(w,cat){const d=document.createElement('div');d.className='word-card';d.innerHTML=`<span class="card-icon">${w.ic}</span><div class="card-word">${w.word}</div><div class="card-mn">${w.mn}</div>`;d.onclick=()=>selectWord(w,d,cat||currentCat);return d;}
function renderCat(cat){currentCat=cat;document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');t.style.background='white';t.style.color='#718096';});const at=document.querySelector('.tab[data-cat="'+cat+'"]');if(at){const m=catMeta[cat];at.classList.add('active');at.style.background=m.color;at.style.color='white';}const content=document.getElementById('mainContent');const m=catMeta[cat];const ws=words[cat];content.innerHTML='';const hdr=document.createElement('div');hdr.className='section-header';hdr.innerHTML=`<h2 style="color:${m.color}">${m.label}</h2><span class="s-count">${ws.length}个单词</span>`;content.appendChild(hdr);const grid=document.createElement('div');grid.className='cards-grid';ws.forEach(w=>grid.appendChild(makeCard(w)));content.appendChild(grid);}
function buildTabs(){const tabBar=document.getElementById('tabBar');Object.keys(catMeta).forEach(cat=>{const m=catMeta[cat];const t=document.createElement('div');t.className='tab';t.dataset.cat=cat;t.textContent=m.label;t.onclick=()=>renderCat(cat);tabBar.appendChild(t);});}
function doSearch(val){const q=val.trim().toLowerCase();document.getElementById('searchClear').style.display=q?'block':'none';const sr=document.getElementById('searchResults'),mc=document.getElementById('mainContent'),tabs=document.getElementById('tabBar');if(!q){sr.style.display='none';mc.style.display='';tabs.style.display='flex';return;}mc.style.display='none';tabs.style.display='none';sr.style.display='block';const hits=[];Object.keys(words).forEach(cat=>words[cat].forEach(w=>hits.push({...w,cat})));const filtered=hits.filter(w=>w.word.toLowerCase().includes(q)||w.mn.includes(q));if(!filtered.length){sr.innerHTML='<div class="search-empty">😕 没找到"'+val+'"</div>';return;}sr.innerHTML='';const grid=document.createElement('div');grid.className='cards-grid';filtered.forEach(w=>grid.appendChild(makeCard(w,w.cat)));sr.appendChild(grid);}
function clearSearch(){document.getElementById('searchInput').value='';doSearch('');}
buildTabs();renderCat(Object.keys(catMeta)[0]);
</script>
</body>
</html>
